name: wellspring
services:
  db:
    image: ${POSTGRES_IMAGE:?请在环境文件中设置已核验的 POSTGRES_IMAGE}
    pull_policy: never
    entrypoint: ["bash", "/usr/local/bin/wellspring-db-entrypoint.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: wellspring_owner
      POSTGRES_DB: wellspring
      POSTGRES_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets:
      - db_owner_password
      - runtime_password
    volumes:
      - wellspring_db:/var/lib/postgresql/data
      - ./init-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
      - ./db-entrypoint.sh:/usr/local/bin/wellspring-db-entrypoint.sh:ro
    tmpfs:
      - /run/wellspring-secrets
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wellspring_owner -d wellspring"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  migrate:
    image: ${APP_IMAGE:-wellspring/app:0.0.8}
    pull_policy: never
    profiles: [tools]
    command: ["migrate"]
    environment:
      DB_USER: wellspring_owner
      DB_PASSWORD_FILE: /run/secrets/db_owner_password
    secrets: [db_owner_password]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  bootstrap:
    image: ${APP_IMAGE:-wellspring/app:0.0.8}
    pull_policy: never
    profiles: [tools]
    command: ["bootstrap"]
    environment:
      DB_USER: wellspring_app
      DB_PASSWORD_FILE: /run/secrets/runtime_password
    secrets: [runtime_password]
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    restart: "no"
  app:
    image: ${APP_IMAGE:-wellspring/app:0.0.8}
    pull_policy: never
    environment:
      DB_USER: wellspring_app
      DB_PASSWORD_FILE: /run/secrets/runtime_password
      WELLSPRING_AI_ALLOWED_HOSTS: ${AI_ALLOWED_HOSTS:-localhost,127.0.0.1,::1,host.docker.internal}
      WELLSPRING_AI_API_KEY: ${AI_API_KEY:-}
      WELLSPRING_MAP_TILE_DIR: ${MAP_TILE_DIR:-}
      WELLSPRING_MAP_ATTRIBUTION: ${MAP_ATTRIBUTION:-本地授权底图}
      WELLSPRING_MAP_TILE_CRS: ${MAP_TILE_CRS:-WGS84}
      WELLSPRING_MAP_MIN_ZOOM: ${MAP_MIN_ZOOM:-0}
      WELLSPRING_MAP_MAX_ZOOM: ${MAP_MAX_ZOOM:-20}
      WELLSPRING_MAP_CENTER: ${MAP_CENTER:-120.297066,31.576634}
      WELLSPRING_MAP_INITIAL_ZOOM: ${MAP_INITIAL_ZOOM:-13}
    secrets: [runtime_password]
    volumes:
      - wellspring_ai_secrets:/app/.secrets
      - wellspring_map_tiles:/app/map-tiles:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [backend]
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${HTTP_PORT:-8080}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped
networks:
  backend:
    internal: true
volumes:
  wellspring_db:
  wellspring_ai_secrets:
  wellspring_map_tiles:
secrets:
  db_owner_password:
    file: ${SECRETS_DIR:?请指定密钥目录}/db_owner_password
  runtime_password:
    file: ${SECRETS_DIR:?请指定密钥目录}/runtime_password
